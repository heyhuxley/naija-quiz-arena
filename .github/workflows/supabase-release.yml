name: Supabase release

on:
  push:
    branches:
      - staging
    paths:
      - "supabase/**"
      - ".github/workflows/supabase-release.yml"
      - ".github/workflows/quality.yml"
      - "package.json"
      - "package-lock.json"
      - "app/**"
      - "workers/**"
      - "vite.config.ts"
      - "wrangler.jsonc"
  workflow_dispatch:
    inputs:
      target:
        description: Supabase environment to deploy
        required: true
        type: choice
        options:
          - staging
          - production

permissions:
  contents: write

concurrency:
  group: supabase-${{ github.ref }}
  cancel-in-progress: false

jobs:
  quality:
    uses: ./.github/workflows/quality.yml

  deploy-staging:
    if: github.ref == 'refs/heads/staging' && (github.event_name == 'push' || inputs.target == 'staging' || inputs.target == 'production')
    needs: quality
    runs-on: ubuntu-latest
    environment: staging
    permissions:
      contents: read
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v3
        with:
          version: 2.62.10
      - name: Verify staging credentials
        shell: bash
        run: |
          test -n "$SUPABASE_ACCESS_TOKEN" || { echo "Set SUPABASE_ACCESS_TOKEN in the staging environment."; exit 1; }
          test -n "$SUPABASE_PROJECT_REF" || { echo "Set SUPABASE_PROJECT_REF in the staging environment."; exit 1; }
          if [ -n "$(git ls-files 'supabase/migrations/*.sql')" ]; then
            test -n "$SUPABASE_DB_PASSWORD" || { echo "Set SUPABASE_DB_PASSWORD in the staging environment."; exit 1; }
          fi
      - name: Apply migrations
        if: hashFiles('supabase/migrations/*.sql') != ''
        run: supabase db push --remote "$SUPABASE_PROJECT_REF" --yes
      - name: Deploy Edge Functions
        if: hashFiles('supabase/functions/**') != ''
        run: supabase functions deploy --remote "$SUPABASE_PROJECT_REF" --yes

  deploy-production:
    if: github.ref == 'refs/heads/staging' && github.event_name == 'workflow_dispatch' && inputs.target == 'production'
    needs: [quality, deploy-staging]
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: write
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: supabase/setup-cli@v3
        with:
          version: 2.62.10
      - name: Verify production credentials
        shell: bash
        run: |
          test -n "$SUPABASE_ACCESS_TOKEN" || { echo "Set SUPABASE_ACCESS_TOKEN in the production environment."; exit 1; }
          test -n "$SUPABASE_PROJECT_REF" || { echo "Set SUPABASE_PROJECT_REF in the production environment."; exit 1; }
          if [ -n "$(git ls-files 'supabase/migrations/*.sql')" ]; then
            test -n "$SUPABASE_DB_PASSWORD" || { echo "Set SUPABASE_DB_PASSWORD in the production environment."; exit 1; }
          fi
      - name: Apply migrations
        if: hashFiles('supabase/migrations/*.sql') != ''
        run: supabase db push --remote "$SUPABASE_PROJECT_REF" --yes
      - name: Deploy Edge Functions
        if: hashFiles('supabase/functions/**') != ''
        run: supabase functions deploy --remote "$SUPABASE_PROJECT_REF" --yes
      - name: Promote the approved commit to production
        run: |
          git fetch origin main
          git merge-base --is-ancestor origin/main "$GITHUB_SHA"
          git push origin "$GITHUB_SHA:refs/heads/main"
